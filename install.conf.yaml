- defaults:
    create:
      mode: 0755

- clean:
    ~/:
    ~/.config:
        recursive: true

- link:
    ~/.gitconfig:
    ~/.ideavimrc:
    ~/.profile:
    ~/.tmux.conf:
    ~/.vimrc:
    ~/.zpreztorc:
    ~/.zprofile:
    ~/.zshrc:
    ~/.config/nvim:
      create: true
    ~/.config/workmux/config.yaml:
      path: workmux.yaml
      create: true
    ~/.local/bin/wm:
      path: bin/wm
      create: true
    ~/.ssh/config.d/mini.conf:
      path: ssh/mini.conf
      create: true

- create: ['~/.vim', '~/.vim/_swaps', '~/.vim/_backups']

- shell:
  - command: ./bootstrap
    description: Installing packages (Homebrew, fzf, prezto, tmux, rust)
    stdout: true
    stderr: true
