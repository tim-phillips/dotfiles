# Shared ssh hosts, tracked in dotfiles. Linked to ~/.ssh/config.d/mini.conf.
#
# This repo is public: nothing with an IP, username, or key path goes in here.
# Only bare names that mean nothing outside my tailnet, or public services.
# Machine-specific hosts (jade, work boxes) stay in ~/.ssh/config, untracked.
#
# Only applies if ~/.ssh/config carries `Include ~/.ssh/config.d/*.conf`.
# bootstrap adds that line, building the candidate in a temp file and running
# it past `ssh -G` before renaming it into place -- a malformed or truncated
# ~/.ssh/config makes ssh refuse every connection, git included, so it is
# worth the belt and braces.

# Connection multiplexing. The first connection does the full handshake
# (~210ms on the LAN, worse over a relay) and leaves a socket behind; every
# later one reuses it at ~30ms. Worth it where calls repeat: `wm` makes 2-3
# ssh calls per command (see bin/wm) and the agent dashboard polls, so this
# is what keeps the mini feeling local instead of remote. github.com is here
# for the same reason -- git opens a fresh connection per fetch/push.
#
# Scoped rather than dropped into `Host *` on purpose. A live master socket
# reaches the host with no key and no passphrase, so it stays away from
# anything where that's a liability (jade is root with an unencrypted key).
# The other cost of scoping: flags fixed at connection setup are silently
# ignored when a master already exists -- `-A` most of all, though `-t` and
# `-L` ride along fine. Use `-o ControlPath=none` to force a private
# connection when that matters. Neither host needs it: the mini authenticates
# to GitHub with its own key.
#
# ControlPath's directory is not created by ssh; bootstrap makes it 0700.
#
# ServerAliveInterval is repeated here rather than inherited from `Host *` so
# the block is self-contained. It's what pays for the caching: without it a
# master wedged by a sleep or a tailnet re-route hangs *every* later call to
# that host, since they all share one socket.
Host mini github.com
  ControlMaster auto
  ControlPath ~/.ssh/sockets/%r@%h:%p
  ControlPersist 10m
  ServerAliveInterval 30
